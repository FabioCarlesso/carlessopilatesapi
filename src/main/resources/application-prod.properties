spring.flyway.locations=classpath:db/migration

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never

# Enquanto não houver SMTP contratado, o indicador de mail falha continuamente
# (spring.mail.host fica vazio) e derruba o /actuator/health agregado para DOWN —
# o agregado soma todos os indicadores, ao contrário das probes, que usam grupos
# restritos e por isso continuavam UP. Ao contratar o SMTP, remova esta linha para
# voltar a monitorar a conectividade real do envio de e-mail.
management.health.mail.enabled=false

# Documentação da API (OpenAPI/Swagger) desabilitada em produção para não expor
# o mapa completo da API publicamente. As rotas /api-docs e /swagger-ui passam a
# retornar 404 no perfil prod; permanecem acessíveis em dev/default.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
