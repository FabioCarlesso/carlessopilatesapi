spring.application.name=CarlessoPilatesApi

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:carlesso_pilates}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Compressão gzip das respostas. O ganho está nas listagens grandes de texto
# clínico: GET /evolucoes-sessao/paciente/3 (384 evoluções) cai de 329.192 para
# 41.316 bytes, medido em 05/08/2026 (a decisão de não paginar a listagem, na #158,
# pressupõe isso ligado). Fora da lista de mime-types ficam o XLSX dos relatórios
# — já é um zip, recomprimir não rende — e os binários de foto. O CSV entra por
# ser texto repetitivo.
# Atenção ao min-response-size: o Tomcat só o consulta quando a resposta declara
# Content-Length. Todo JSON do Spring MVC sai em Transfer-Encoding: chunked — logo
# é comprimido independentemente do tamanho, inclusive /auth/**. A única resposta
# desta API que hoje chega a ser avaliada pelo limiar é o CSV do relatório NFSe,
# que devolve byte[] com Content-Length. Ver a análise de BREACH no README; em
# resumo, com token Bearer não há credencial ambiente para o atacante explorar.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv,text/css,text/html,application/javascript
server.compression.min-response-size=1024

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

management.endpoints.web.exposure.include=health,prometheus
# Expõe /actuator/health/liveness e /readiness fora do Kubernetes.
# O HEALTHCHECK do Dockerfile usa o liveness, que reflete apenas o estado do
# processo — indisponibilidade de dependências (banco, SMTP) não derruba o container.
# Isso vale só para as probes, que usam grupos restritos: o /actuator/health agregado
# soma todos os indicadores e cai para DOWN se qualquer um falhar. Healthcheck externo
# deve apontar para /actuator/health/readiness (ver docs/operacao.md).
management.endpoint.health.probes.enabled=true
# O starter de mail no classpath registra o MailHealthIndicator por padrão. Enquanto não
# houver SMTP contratado (spring.mail.host vazio), ele falha continuamente e derruba o
# agregado para DOWN — foi o que deixou a produção em 503 com o serviço são (#153).
# Declarado aqui, no arquivo base, para valer em todos os perfis de uma vez; só o
# application.properties de teste precisa repetir, porque sombreia este no classpath.
# Ao contratar o SMTP, reative com management.health.mail.enabled=true no perfil desejado
# e ajuste o MailHealthPropriedadesTest, que hoje exige o desligamento nos dois arquivos.
# Atenção: variável de ambiente (MANAGEMENT_HEALTH_MAIL_ENABLED) sobrepõe este valor e
# nenhum teste enxerga isso — ver a nota de smoke check em docs/operacao.md.
management.health.mail.enabled=false
# /actuator/prometheus exige role ADMIN (ver SecurityConfig); a tag application
# identifica a origem das séries no Prometheus.
management.metrics.tags.application=${spring.application.name}
# Credencial fixa do scrape (ver MetricsScrapeTokenFilter); vazia = só JWT de ADMIN.
app.metrics.scrape-token=${APP_METRICS_SCRAPE_TOKEN:}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.refresh-session-max-ms=${JWT_REFRESH_SESSION_MAX_MS:2592000000}
jwt.refresh-reuse-grace-ms=${JWT_REFRESH_REUSE_GRACE_MS:10000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
# Rate limit por IP de /auth/login e /auth/forgot-password, somado ao limite por e-mail
# (5 em 15 min, fixo). Mais folgado que o por e-mail para não punir usuários atrás do
# mesmo NAT. Estado em memória: vale por instância (ver docs/regras-de-negocio.md).
app.rate-limit.ip.max-tentativas=${APP_RATE_LIMIT_IP_MAX_TENTATIVAS:20}
app.rate-limit.ip.janela-minutos=${APP_RATE_LIMIT_IP_JANELA_MINUTOS:15}
# IPs/CIDRs dos proxies reversos confiáveis, separados por vírgula. Só conexões vindas
# deles têm o X-Forwarded-For considerado; vazio = cabeçalho ignorado (ver ClientIpResolver).
app.security.trusted-proxies=${APP_SECURITY_TRUSTED_PROXIES:}
app.initial-admin.email=${APP_INITIAL_ADMIN_EMAIL:admin@carlessopilates.com}
app.initial-admin.password=${APP_INITIAL_ADMIN_PASSWORD:}

app.cobranca.cron-vencidos=${APP_COBRANCA_CRON_VENCIDOS:0 0 6 * * *}
app.cobranca.cron-cobrancas-futuras=${APP_COBRANCA_CRON_COBRANCAS_FUTURAS:0 0 7 * * *}
app.cobranca.vencimento-dias=${APP_COBRANCA_VENCIMENTO_DIAS:10}
# Fuso do estúdio para os horários gravados pelo servidor e exibidos sem conversão no frontend (ex.: registradoEm dos
# contatos de cobrança). Não depende do fuso da JVM, que num container costuma ser UTC.
app.fuso-horario=${APP_FUSO_HORARIO:America/Sao_Paulo}
app.refresh-token.cron-limpeza=${APP_REFRESH_TOKEN_CRON_LIMPEZA:0 30 3 * * *}
spring.data.web.pageable.default-page-size=${APP_PAGINACAO_TAMANHO_PADRAO:10}
# Página serializada como {content, page:{...}}. Fica aqui, e não num @EnableSpringDataWebSupport: a anotação desliga a
# autoconfiguração do Boot e, com ela, o default-page-size acima, que deixaria de valer em silêncio.
spring.data.web.pageable.serialization-mode=via-dto

# Foto da análise postural: JPEG/PNG de até 2 MB (frontend comprime para ~1080px);
# acima disso o Spring rejeita o multipart com 413 antes de chegar ao controller.
app.foto.storage=${APP_FOTO_STORAGE:postgres}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

app.email.provider=${APP_EMAIL_PROVIDER:smtp}
app.email.from=${APP_EMAIL_FROM:no-reply@carlessopilates.com.br}
app.email.reset-password-url=${APP_EMAIL_RESET_PASSWORD_URL:https://app.carlessopilates.com.br/resetar-senha}
app.email.reset-password-token-ttl-minutos=${APP_EMAIL_RESET_PASSWORD_TOKEN_TTL_MINUTOS:30}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
