spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.flyway.enabled=false

spring.web.resources.add-mappings=false

# Espelha a compressão de src/main/resources/application.properties — este arquivo
# sombreia o principal no classpath de teste, então sem isso o
# CompressaoRespostaIntegrationTest rodaria contra o padrão desligado do Boot.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/csv,text/css,text/html,application/javascript
server.compression.min-response-size=1024

spring.application.name=CarlessoPilatesApi
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Repete o arquivo principal porque este o sombreia no classpath de teste. Sem isso o
# indicador de mail tentaria o spring.mail.host=localhost:3025 abaixo, falharia e deixaria
# o ActuatorTest vermelho no agregado. O MailHealthPropriedadesTest guarda os dois arquivos.
management.health.mail.enabled=false
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=Carlesso Pilates API

jwt.secret=0123456789012345678901234567890101234567890123456789012345678901
jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:4200

app.cobranca.cron-vencidos=0 0 6 * * *
app.cobranca.cron-cobrancas-futuras=0 0 7 * * *
app.cobranca.vencimento-dias=10
app.agenda.duracao-aula-minutos=60
app.agenda.capacidade-por-horario=3
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.serialization-mode=via-dto
spring.data.web.pageable.max-page-size=2000

app.email.provider=smtp
app.email.from=no-reply@carlessopilates.com.br
app.email.reset-password-url=https://app.carlessopilates.com.br/resetar-senha
app.email.reset-password-token-ttl-minutos=30
spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test
spring.mail.password=test
